  let i=-1;for(let k=0;k<list.length;k++)if(list[k][0]<=t)i=k;if(i<0)i=0;
  const cur=list[i],prev=list[Math.max(0,i-1)],k=i>0?eo((t-cur[0])/cross):1;
  if(a.dataset.s!==prev[1]){a.src=src(prev[1]);a.dataset.s=prev[1]}if(b.dataset.s!==cur[1]){b.src=src(cur[1]);b.dataset.s=cur[1]}
  b.style.opacity=k;const z=1+.04*cl((t-cur[0])/6);b.style.transform=`scale(${z}) translateY(${(1-k)*4}%)`;a.style.transform=`scale(${1+.04})`;
  return i;
}
let lastScene=-1,chipEls=[];
function render(t){
  // scene
  let si=SC.findIndex(s=>t>=s.t0&&t<s.t1);if(si<0)si=SC.length-1;const S=SC[si],st=t-S.t0,left=S.t1-t;
  const prevS=SC[Math.max(0,si-1)],ck=eo(st/0.8);
  const c0=mix(prevS.c[0],S.c[0],si?ck:1),c1=mix(prevS.c[1],S.c[1],si?ck:1);
  bg.style.background=`radial-gradient(120% 90% at ${V?50:75}% 20%, ${c0} 0%, #2B1B6B 55%, #160E3A 100%)`;
  blobs.forEach((b,i)=>{const a=t*.15+i*1.7;b.style.background=i%2?c1:c0;b.style.left=(W*(.5+.42*Math.sin(a*.7+i)))-b.offsetWidth/2+'px';b.style.top=(H*(.5+.38*Math.cos(a*.5+i*2)))-b.offsetHeight/2+'px'});
  gls.forEach(g=>{const y=((g.y-t*g.sp*1.2)%110+110)%110-5;g.e.style.left=g.x+'%';g.e.style.top=y+'%';g.e.style.transform=`rotate(${Math.sin(t*.3+g.x)*15}deg)`});
  // outro
  const O=$('#outro');
  if(S.outro){const k=eo(st/0.9);O.style.opacity=k;O.style.transform=`scale(${.9+.1*eb(st/0.9)})`;
    $('#gp').style.transform=`scale(${1+.05*Math.sin(t*4)*cl((st-3.3)/0.5)})`;$('#gp').style.opacity=cl((st-3.2)/0.6);$('#price').style.opacity=cl((st-4.5)/0.6);
    ph.style.opacity=ph2.style.opacity=1-k;panel.style.opacity=1-k;logo.style.opacity=1-k;tch.style.opacity=0}
  else{O.style.opacity=0;ph.style.opacity=1;panel.style.opacity=1;logo.style.opacity=si===0&&!V?0:1}
  // phone
  const allIdx=setImg($('#a0'),$('#a1'),shotsAll,t,0.5);
  const nxt=shotsAll[Math.min(shotsAll.length-1,allIdx+1)],b1=$('#b1');if(b1.dataset.s!==nxt[1]){b1.src=src(nxt[1]);b1.dataset.s=nxt[1]}$('#b0').style.opacity=0;
  const intro=eb(t/1.1),bump=si>0&&st<0.7?Math.sin(st/0.7*Math.PI)*.025:0;
  const sw=Math.sin(t*.6)*1.5;
  if(V){ph.style.left=(L.px-L.pw/2)+'px';ph.style.top=(L.py-PH/2+(1-intro)*H*.6)+'px';ph.style.transform=`rotate(${sw*.6}deg) scale(${1+bump})`;
    ph2.style.left=(L.px-L.pw/2-L.pw*.62)+'px';ph2.style.top=(L.py-PH/2+PH*.06+(1-intro)*H*.6)+'px';ph2.style.transform=`rotate(${-10+sw}deg) scale(.8)`;ph2.style.opacity=S.outro?0:.45;
  }else{ph.style.left=(L.px-L.pw/2)+'px';ph.style.top=(L.py-PH/2+(1-intro)*H)+'px';ph.style.transform=`rotate(${-3+sw}deg) scale(${1+bump})`;
    ph2.style.left=(L.px-L.pw/2-L.pw*.62)+'px';ph2.style.top=(L.py-PH/2+PH*.07+(1-intro)*H)+'px';ph2.style.transform=`rotate(${-12+sw}deg) scale(.8)`;ph2.style.opacity=S.outro?0:.5}
  // panel
  if(!S.outro){
    if(si!==lastScene){$('#chip').textContent=S.chip;const cs=$('#chips');cs.innerHTML='';chipEls=S.chips.map(([ct,tx])=>{const e=document.createElement('div');e.className='kc'+(S.big?' big':'');e.textContent=tx;cs.appendChild(e);return[ct,e]});lastScene=si}
    let hi=0;S.heads.forEach((h,i)=>{if(t>=h[0])hi=i});const hd=$('#head');if(hd.dataset.i!==si+'_'+hi){hd.innerHTML=S.heads[hi][1];hd.dataset.i=si+'_'+hi}
    const hst=t-S.heads[hi][0],ink=eo(hst/0.6),outk=eo((0.4-left)/0.4);
    const dx=V?0:(1-ink)*W*.05;
    $('#chip').style.opacity=eo(st/0.5)*(1-outk);$('#chip').style.transform=`translateY(${(1-eo(st/0.5))*30}px)`;
    hd.style.opacity=ink*(1-outk);hd.style.transform=`translateX(${-dx}px) translateY(${V?(1-ink)*40:0}px)`;
    const vis=chipEls.filter(([ct])=>t>=ct).length,maxV=V?5:99;chipEls.forEach(([ct,e],i)=>{const old=V&&i<vis-maxV;e.style.display=old?'none':'';const k=(t-ct)/0.45;e.style.opacity=cl(k*1.5)*(1-outk);e.style.transform=`scale(${k<0?0.3:.3+.7*eb(k)})`});
    big.style.display=S.logo&&!V?'block':'none';if(S.logo){const k=eb(t/0.9);big.style.opacity=cl(t/0.5)*(1-outk);big.style.transform=`scale(${.4+.6*k}) rotate(${(1-k)*-12}deg)`;big.style.marginBottom=(V?W*.02:H*.02)+'px'}
    if(S.teacher){tch.style.opacity=eo(st/0.6)*(1-outk);const k=eb(st/0.8);
      if(V){tch.style.left=(W*.5+L.pw*.32)+'px';tch.style.top=(L.py-PH*.38)+'px'}else{tch.style.left=(L.px+L.pw*.32)+'px';tch.style.top=(L.py-PH*.5)+'px'}
      tch.style.transform=`scale(${k}) translateY(${Math.sin(t*2.2)*6}px)`}else tch.style.opacity=0;
    if(V){$('#chips').style.position='absolute';$('#chips').style.top=(L.chipsY-L.ty)+'px';$('#chips').style.width=L.tw+'px'}
  }
  // subtitles
  const sb=$('#sub');const cur=S.outro?null:SUB.find(s=>t>=s[0]&&t<s[1]+0.25);if(!V){sb.style.left=(L.tx+L.tw/2)+'px';sb.style.maxWidth=(L.tw+W*.04)+'px'}
  if(cur){if(sb.dataset.t!==cur[2]){sb.textContent=cur[2];sb.dataset.t=cur[2]}const k=eo((t-cur[0])/0.25);sb.style.opacity=k;sb.style.top=(L.subY-sb.offsetHeight/2+(1-k)*10)+'px'}else sb.style.opacity=0;
  // fade
  $('#fade').style.opacity=Math.max(cl(1-t/0.6),cl((t-(DUR-1.2))/1.2));
}
window.render=render;const PRE=[...new Set(shotsAll.map(x=>x[1]))].map(n=>{const i=new Image();i.src=src(n);return i});
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images,...PRE].map(i=>i.decode().catch(()=>0))));

</script></body></html>
